<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#20242a"><meta name="description" content="Derya Agency ilə biznesinizin marketinq ehtiyacını müəyyənləşdirin və ilkin analiz üçün müraciət edin.">
<title>Derya Agency — İlkin marketinq analizi</title>
<style>
/* Neutral interim identity. Official brandbook assets are not available in this workspace. */
:root{--ink:#20242a;--muted:#697079;--paper:#f7f8f9;--line:#dfe2e6;--accent:#303b4a;--soft:#f0f3f6;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--paper);font-synthesis:none}
*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}a{color:inherit}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #607c9f;outline-offset:4px}button:disabled{cursor:default;opacity:.35}[hidden]{display:none!important}
.shell{max-width:1160px;margin:auto;padding:0 40px}header{height:100px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{text-decoration:none;font-size:21px;font-weight:700;letter-spacing:-.6px}.brand span{font-weight:400;margin-left:6px;color:var(--muted)}.contact{font-size:13px;text-decoration:none;color:var(--muted);padding:12px 0}.contact:hover{color:var(--ink)}
main{padding:48px 0 56px}.layout{max-width:740px;margin:auto}.intro-side{margin-bottom:30px}h1{font-size:30px;line-height:1.3;letter-spacing:-.7px;font-weight:500;margin:0 0 12px}.intro{font-size:14px;line-height:1.8;color:var(--muted);margin:0;max-width:620px}.panel{background:#fff;border:1px solid var(--line);border-radius:5px;overflow:hidden}.panel-top{padding:28px 40px 0}.progress-meta{display:flex;justify-content:space-between;gap:15px;font-size:12px;color:var(--muted)}.progress-meta strong{font-weight:400;color:var(--ink)}.track{height:2px;background:#e9ecf0;margin-top:18px;overflow:hidden}.bar{height:100%;background:var(--accent)}.content{padding:36px 40px 4px}.step-kicker{display:none}h2{font-size:24px;line-height:1.4;letter-spacing:-.4px;font-weight:500;margin:0 0 12px}h2:focus{outline:none}.hint{font-size:14px;line-height:1.7;color:var(--muted);margin:0 0 28px}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.option{position:relative;display:flex;align-items:center;gap:18px;min-height:80px;padding:20px;border:1px solid var(--line);border-radius:4px;cursor:pointer}.option:hover{background:#fafbfc;border-color:#a6afb9}.option:has(input:checked){border-color:var(--accent);background:var(--soft)}.option:has(input:focus-visible){outline:3px solid #607c9f;outline-offset:2px}.option input{position:absolute;opacity:0;width:1px;height:1px}.choice-icon{display:none}.choice-text{font-size:14px;font-weight:400;line-height:1.6;flex:1}.check{border:1px solid #b7bec7;border-radius:50%;width:17px;height:17px;flex-shrink:0;display:grid;place-items:center;color:transparent;font-size:11px}.option:has(input:checked) .check{background:var(--accent);border-color:var(--accent);color:white}.multiple .check{border-radius:3px}.wide{grid-template-columns:1fr}.wide .option{min-height:64px}.error{color:#a82e20;font-size:13px;line-height:1.6;min-height:20px;margin:16px 0 0}.panel-bottom{padding:12px 40px 28px}.navigation{display:flex;align-items:center;justify-content:space-between;gap:20px}.back{border:0;background:none;color:var(--muted);font-size:13px;padding:15px 0}.primary{border:1px solid var(--ink);background:var(--ink);color:white;border-radius:4px;padding:15px 24px;min-height:49px;font-size:13px;font-weight:400;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:26px}.primary:hover{background:#3b424c}.footnote{border-top:1px solid var(--line);padding-top:22px;margin:28px 0 0;font-size:12px;line-height:1.8;color:var(--muted)}.field{margin-bottom:23px}.field label{font-size:13px;display:block;margin-bottom:10px;font-weight:400}.field input{width:100%;padding:15px;border:1px solid #cdd3db;border-radius:4px;background:#fff;font-size:16px;color:var(--ink)}.field input[aria-invalid=true]{border-color:#a82e20}.optional{color:var(--muted)}.summary{margin:0}.summary>div{display:grid;grid-template-columns:150px 1fr auto;gap:18px;padding:17px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.7}.summary dt{color:var(--muted)}.summary dd{margin:0;overflow-wrap:anywhere}.edit{font-size:12px;border:0;background:none;color:var(--accent);padding:4px;text-decoration:underline;text-underline-offset:3px}.result{border-left:2px solid #a9b2bf;padding:4px 0 4px 18px;margin:0 0 25px;font-size:13px;line-height:1.8;color:var(--muted)}.result strong{display:block;font-size:14px;color:var(--ink);font-weight:500;margin-bottom:5px}.send{width:100%;gap:16px;font-size:14px;margin-top:28px}.restart{display:block;margin:23px auto 12px;border:0;background:none;font-size:12px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}.bottomline{display:flex;justify-content:space-between;gap:20px;border-top:1px solid var(--line);padding:25px 0;font-size:12px;color:var(--muted)}.bottomline a{text-decoration:none}
@media(max-width:650px){.shell{padding:0 20px}header{height:78px}.brand{font-size:18px}.contact{font-size:12px}main{padding:32px 0}.intro-side{margin-bottom:24px}h1{font-size:26px}.intro{font-size:13px}.panel-top{padding:23px 22px 0}.content{padding:28px 22px 4px}h2{font-size:22px}.hint{font-size:13px;margin-bottom:24px}.options{grid-template-columns:1fr;gap:10px}.option,.wide .option{min-height:62px;padding:17px}.choice-text{font-size:14px}.panel-bottom{padding:10px 22px 24px}.footnote{font-size:11px;margin-top:25px}.summary>div{grid-template-columns:90px 1fr auto;gap:10px;font-size:12px}.bottomline{font-size:10px}.primary{padding:14px 20px}.progress-meta{font-size:11px}.result{font-size:12px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body><div class="shell">
<header><a class="brand" href="./index.html" aria-label="Derya Agency başlanğıc">Derya<span>Agency</span></a><a class="contact" href="https://wa.me/994503386401" target="_blank" rel="noopener noreferrer">Əlaqə ↗</a></header>
<main><div class="layout"><aside class="intro-side"><h1>İlkin marketinq analizi</h1><p class="intro">Biznesinizə uyğun xidmətin müəyyənləşdirilməsi üçün qısa müraciət forması.</p></aside>
<section class="panel" aria-label="Marketinq ehtiyacının müəyyənləşdirilməsi"><div class="panel-top"><div class="progress-meta"><strong id="counter"></strong><span id="phase"></span></div><div class="track" role="progressbar" aria-label="Tamamlanma" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div></div><form id="wizard" novalidate><div class="content" id="content"></div><div class="panel-bottom"><div class="navigation" id="navigation"><button class="back" id="back" type="button">← &nbsp; Geri</button><button class="primary" type="submit" id="next">Davam et <span aria-hidden="true">→</span></button></div><p class="footnote">Cavablarınız yalnız WhatsApp-da göndərməyi təsdiqlədikdən sonra bizə çatır.</p></div></form></section></div></main>
<footer class="bottomline"><span>© Derya Agency</span><a href="tel:+994503386401">+994 50 338 64 01</a></footer>
</div><noscript><p style="padding:24px">Bu formanı doldurmaq üçün JavaScript-i aktiv edin və ya <a href="https://wa.me/994503386401">WhatsApp-da bizimlə əlaqə saxlayın</a>.</p></noscript>
<script>
'use strict';
const steps=[
{id:'goal',label:'Məqsəd',title:'Biznesiniz üçün nə istəyirsiniz?',hint:'Hazırda sizin üçün ən vacib olan bir məqsədi seçin.',options:['Daha çox satış','Daha çox müraciət','Instagram inkişafı','Reklam nəticələrini yaxşılaşdırmaq','Google-da görünmək','Bilmirəm — analiz istəyirəm'],icons:['↗','◉','◎','⚑','⌕','✧']},
{id:'ads',label:'Reklam vəziyyəti',title:'Hazırda reklam edirsiniz?',hint:'Mövcud vəziyyətinizə uyğun variantı seçin.',options:['Bəli, aktiv reklamlarımız var','Əvvəllər etmişik','Xeyr, heç etməmişik']},
{id:'manager',label:'Reklamı idarə edən',title:'Reklamları kim idarə edir?',hint:'Beləliklə, mövcud iş prosesinizi daha yaxşı anlayarıq.',options:['Özümüz','Freelancer','Başqa agentlik','Şirkət daxilində marketoloq']},
{id:'platforms',label:'Platformalar',title:'Hansı platformalardasınız?',hint:'Biznesinizin istifadə etdiyi platformaları seçin. Bir neçə seçim edə bilərsiniz.',multiple:true,options:['Instagram / Facebook','Google Ads','TikTok','Digər','Hazırda heç biri']},
{id:'problem',label:'Əsas problem',title:'Sizi ən çox nə narahat edir?',hint:'İlk olaraq diqqət yetirməyimizi istədiyiniz bir məsələni seçin.',options:['Reklam nəticə vermir','Müraciətlər azdır','Satış azdır','Reklam bahadır','Kontent zəifdir','Səbəbi bilmirik','Sadəcə böyümək istəyirik']},
{id:'budget',label:'Aylıq reklam büdcəsi',title:'Reklam üçün aylıq büdcəniz?',hint:'Platformalara ayırdığınız və ya ayırmağı düşündüyünüz məbləğ. Agentliyin xidmət haqqı buraya daxil deyil.',options:['300 AZN-dən az','300–500 AZN','501–1 000 AZN','1 001–2 000 AZN','2 000 AZN-dən çox','Hələ müəyyən etməmişik']},
{id:'help',label:'İstənilən kömək',title:'Sizə necə kömək edə bilərik?',hint:'İlkin gözləntinizi seçin. Uyğun xidmətin həcmini analizdən sonra dəqiqləşdirərik.',options:['İlkin ödənişsiz analiz','Reklamların qurulması və idarəsi','Kreativlər və reklam testləri','Lead və ölçmə sisteminin qurulması','Kontent / SMM üzrə dəstək','Birlikdə qərar verək']}
];
const answers={platforms:[]};let index=0;
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function activeSteps(){return steps.filter(s=>s.id!=='manager'||answers.ads===steps[1].options[0])}
function render(focus=false){const list=activeSteps(),summary=index>=list.length,step=list[index];const percent=summary?100:Math.round(index/list.length*100);$('#counter').textContent=summary?'Cavablarınız hazırdır':`Addım ${String(index+1).padStart(2,'0')} / ${String(list.length).padStart(2,'0')}`;$('#phase').textContent=summary?'Tamamlandı':index<2?'Məqsəd və vəziyyət':'Marketinq ehtiyacı';$('#bar').style.width=percent+'%';$('.track').setAttribute('aria-valuenow',percent);$('#navigation').hidden=summary;$('.intro-side').hidden=summary;$('.footnote').hidden=summary;$('#back').disabled=index===0;$('#next').innerHTML='Davam et'+' <span aria-hidden="true">→</span>';
if(summary){renderSummary()}else{$('#content').innerHTML=`<p class="step-kicker">${String(index+1).padStart(2,'0')} / ${esc(step.label.toLocaleUpperCase('az'))}</p><h2 tabindex="-1">${step.title}</h2><p class="hint" id="step-hint">${step.hint}</p>`+`<div class="options ${step.multiple?'multiple ':''}${step.options.length<=4?'wide':''}" role="group" aria-label="${esc(step.title)}" aria-describedby="step-hint error">${step.options.map((o,i)=>`<label class="option"><input type="${step.multiple?'checkbox':'radio'}" name="${step.id}" value="${esc(o)}" ${(step.multiple?answers[step.id].includes(o):answers[step.id]===o)?'checked':''}><span class="choice-icon" aria-hidden="true">${step.icons?.[i]||['↗','◎','◈','✧','⌕','↗','◉'][i]}</span><span class="choice-text">${o}</span><span class="check" aria-hidden="true">✓</span></label>`).join('')}</div>`+`<p id="error" class="error" role="alert"></p>`}
if(focus){$('#content h2').focus({preventScroll:true});if(matchMedia('(max-width:650px)').matches)$('.panel').scrollIntoView({behavior:'instant',block:'start'})}}
function summaryRows(){return activeSteps().map(s=>({label:s.label,value:Array.isArray(answers[s.id])?answers[s.id].join(', '):answers[s.id]}))}
function message(){return 'Salam, Derya Agency! İlkin ödənişsiz marketinq analizi üçün müraciət edirəm.\n\n'+summaryRows().map(r=>r.label+': '+r.value).join('\n')+'\n\nBu məlumatlara əsasən uyğun növbəti addımı müzakirə etmək istəyirəm.'}
function renderSummary(){$('#content').innerHTML=`<h2 tabindex="-1">Ödənişsiz reklam analizi</h2><p class="hint">Cavablarınızı göndərin, biznesinizə uyğun reklam imkanlarını birlikdə dəyərləndirək.</p><a class="primary send" target="_blank" rel="noopener noreferrer" href="https://wa.me/994503386401?text=${encodeURIComponent(message())}">Ödənişsiz analiz üçün WhatsApp-a keç <span aria-hidden="true">↗</span></a><p class="hint" style="font-size:12px;text-align:center;margin:16px 0 20px">Hazır mesajı WhatsApp-da göndərin.</p>`}
$('#content').addEventListener('change',e=>{const step=activeSteps()[index];if(!step||!step.options)return;const val=e.target.value;if(step.multiple){if(val==='Hazırda heç biri'){answers.platforms=e.target.checked?[val]:[]}else{answers.platforms=answers.platforms.filter(v=>v!=='Hazırda heç biri'&&v!==val);if(e.target.checked)answers.platforms.push(val)}document.querySelectorAll('input[name="platforms"]').forEach(el=>el.checked=answers.platforms.includes(el.value))}else{answers[step.id]=val;if(step.id==='ads'&&val!==steps[1].options[0])delete answers.manager}$('#error').textContent=''});
function validate(){const s=activeSteps()[index];if(s.multiple?!answers[s.id].length:!answers[s.id]){$('#error').textContent=s.multiple?'Ən azı bir platforma seçin.':'Davam etmək üçün bir variant seçin.';return false}return true}
$('#wizard').addEventListener('submit',e=>{e.preventDefault();if(index>=activeSteps().length||!validate())return;index++;render(true)});
$('#back').addEventListener('click',()=>{if(index>0){index--;render(true)}});
render();
</script></body></html>
